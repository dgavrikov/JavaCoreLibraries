spring:
  datasource:
    hikari:
      jdbc-url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
      username: ${DATASOURCE_USERNAME:}
      password: ${DATASOURCE_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      maximun-pool-size: ${DATASOURCE_MAX_POOL_SIZE:4}
      validation-timeout: ${DATASOURCE_VALIDATION_TIMEOUT_MS:2000}
      max-lifetime: ${DATASOURCE_MAX_LIFETIME_MS:1800000}
      keep-alive-time: ${DATASOURCE_KEEP_ALIVE_TIME_MS:40000}
      minimum-idle: ${DATASOURCE_MINUMIM_IDLE:1}
    properties:
      repository-packages: com.gmail.dgavrikov84
      transaction-timeout: ${DATASOURCE_TRANSACTION_TIMEOUT:50}
      retry-attempts: ${DATASOURCE_RETRY_MAXATTEMPTS:3}
      retry-backoff: ${DATASOURCE_RETRY_MAXDELAY:100ms}
    liquibase:
      change-log: classpath:/db/changelog/db.master.yml
      enabled: ${LIQUIBASE_ENABLED:true}
      user: ${LIQUIBASE_USER:}
      password: ${LIQUIBASE_PASSWORD:}
      url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
      driver-class-name: org.postgresql.Driver
    jpa:
      show-sql: ${DATABASE_SHOW_SQL:false}
      open-in-view: false
      hibernate:
        ddl-auto: none
      properties:
        hibernate:
          query:
            plan_cache_max_size: ${DATABASE_PLAN_CACHE_MAX_SIZE:512}
            plan_parameter_metadata_max_size: ${DATABASE_PLAN_PARAMETER_METADATA_MAX_SIZE:128}

logging:
    level:
      org.hibernate.orm.query: ERROR
      org.hibernate.persister.entity.AbstractEntityPersister: ERROR