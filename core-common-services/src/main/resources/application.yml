spring:
  main:
    web-application-type: servlet
  application:
    name: ${APPLICATION_NAME:CODE.app-name-default}
logging:
  pattern:
    level: "[%X{traceId:-} %X{spanId:-}] %-5level %logger{36} - %msg%n"
  level:
    root: warn
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
    access:
      default: none
  endpoint:
    prometheus:
      access: read_only
    health:
      access: read_only
      probes:
        enabled: true
  metrics:
    web:
      client:
        max-uri-tags: 200
      server:
        max-uri-tags: 200
  tracing:
    sampling:
      probability: 1.0 # Для процессинга обычно льем 100% или настраиваем кастомный семплер
    propagation:
      type: W3C
      produce: W3C