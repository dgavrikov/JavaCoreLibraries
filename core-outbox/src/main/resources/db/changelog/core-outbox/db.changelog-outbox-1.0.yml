databaseChangeLog:
  - changeSet:
      id: core-outbox-create-events-table-v2
      author: d.gavrikov
      comment: Create unified system table for Transactional Outbox with high-load indexes
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  #type: BIGSERIAL
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
              - column:
                  name: event_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_outbox_unpublished
            tableName: outbox_events
            columns:
              - column:
                  name: id
            where: "status = 'NEW'"

        - createIndex:
            indexName: idx_outbox_purge_historical
            tableName: outbox_events
            columns:
              - column:
                  name: created_at
                  order: ASC
            where: "status = 'SENT'"
