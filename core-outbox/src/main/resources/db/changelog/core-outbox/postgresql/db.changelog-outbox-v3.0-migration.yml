databaseChangeLog:
  - changeSet:
      id: core-outbox-migration
      author: d.gavrikov
      comment: Safely migrate data from legacy.
      changes:
        - sqlFile:
            path: "scripts/v3_outbox_migration.sql"
            endDelimiter: ";"
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false