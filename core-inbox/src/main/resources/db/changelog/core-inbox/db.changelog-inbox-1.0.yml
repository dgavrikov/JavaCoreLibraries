databaseChangeLog:
  - changeSet:
      id: core-inbox-init-script
      author: d.gavrikov
      comment: Create unified system table for Transactional Outbox with high-load indexes
      changes:
        - sqlFile:
            dbms: postgresql
            relativeToChangelogFile: true
            path: "scripts/postgresql/inbox-init-v1.sql"
            endDelimiter: ";"
            splitStatements: true
            stripComments: false
      rollback:
        - sqlFile:
            dbms: postgresql
            relativeToChangelogFile: true
            path: "scripts/postgresql/inbox-init-v1-rollback.sql"
            endDelimiter: ";"
            splitStatements: true
            stripComments: false
